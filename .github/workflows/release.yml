name: Release

# Refreshes a release by hand (Run workflow): its notes from
# .github/release-notes/<tag>.md, and SHA256SUMS.txt over every file on it.
# Run it after attaching files on the release page, before publishing a
# draft.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.1"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - name: Notes
        run: gh release edit "$TAG" --notes-file ".github/release-notes/$TAG.md"

      - name: SHA256SUMS.txt
        run: |
          mkdir out
          cd out
          gh release download "$TAG"
          rm -f SHA256SUMS.txt
          sha256sum * > "$RUNNER_TEMP/SHA256SUMS.txt"
          cat "$RUNNER_TEMP/SHA256SUMS.txt"
          gh release upload "$TAG" "$RUNNER_TEMP/SHA256SUMS.txt" --clobber
